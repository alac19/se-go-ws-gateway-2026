[server]
port = 8080

[websocket]
read_buffer_size = 1024
write_buffer_size = 1024
read_deadline_seconds = 60
write_deadline_seconds = 10
control_write_timeout_seconds = 1

[heartbeat]
ping_interval_seconds = 30
pong_wait_seconds = 60
ping_write_timeout_seconds = 10

[channel]
send_buffer_size = 256
register_buffer_size = 256
unregister_buffer_size = 256

[ratelimit]
every_seconds = 12
burst = 5

[graceful_shutdown]
timeout_seconds = 5

[log]
level = "info"     # debug/info/warn/error; 生产可调高到 warn 或 error, 也可用 WS_LOG_LEVEL 覆盖
file_path = "logs/gateway.log" 

[jwt]
secret = "dev-secret-change-me"  # 仅供本地开发，生产用 WS_JWT_SECRET 覆盖
ttl_hours = 24

[auth]
username = "zhangsan"
password_hash = "$2a$10$MqkF//ZWuwkD2z1gJdPYZuURfCrSs4VLa7.dNX1VnBTYg28.lrCka"  # 演示专用

[redis]
enabled = false        # 关闭时使用内存版房间管理且不做跨实例同步, 可用 WS_REDIS_ENABLED 覆盖
addr = "localhost:6379"
password = ""
db = 0
